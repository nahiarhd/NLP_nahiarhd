[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nahiarhdNLP"
version = "1.6.0"
description = "Advanced Indonesian Natural Language Processing Library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raihan Hidayatullah Djunaedi", email = "raihanhd.dev@gmail.com"},
]
keywords = ["nlp", "indonesian", "natural-language-processing", "text-processing", "bahasa-indonesia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "sastrawi>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/raihanhd12/nahiarhdNLP"
Documentation = "https://github.com/raihanhd12/nahiarhdNLP#readme"
Repository = "https://github.com/raihanhd12/nahiarhdNLP"
Issues = "https://github.com/raihanhd12/nahiarhdNLP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "rich>=12.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nahiarhdNLP*"]

[tool.setuptools.package-data]
"nahiarhdNLP" = ["py.typed", "datasets/*.txt", "datasets/*.csv", "datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"
